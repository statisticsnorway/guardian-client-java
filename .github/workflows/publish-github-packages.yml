name: Publish tag to GitHub Packages

# Publishes an existing release tag to GitHub Packages (and creates the GitHub release if missing).
# Used to backfill releases whose upload failed in mvn-release.yml, e.g.:
#   gh workflow run publish-github-packages.yml -f tag=guardian-client-0.2.6
#
# The Dapla artifact registry is not touched: it already receives releases via build-deploy-lib.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. guardian-client-0.2.6"
        required: true
        type: string

concurrency:
  group: publish-github-packages-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      TAG: ${{ inputs.tag }}

    steps:
      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^guardian-client-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          overwrite-settings: false

      # Dependencies may resolve from the Dapla artifact registry (artifactregistry wagon uses ADC).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: "projects/${{secrets.GAR_PROJECT_NUMBER}}/locations/global/workloadIdentityPools/gh-actions/providers/gh-actions"
          service_account: "gh-actions-dftjen@${{secrets.GAR_PROJECT_ID}}.iam.gserviceaccount.com"

      - name: Setup Maven authentication to GitHub packages
        uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        with:
          override: true
          githubServer: false
          servers: >-
            [{"id": "github","username": "${{ github.actor }}","password": "${{ secrets.GITHUB_TOKEN }}"}]

      - name: Check version is not already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if gh api "/orgs/${{ github.repository_owner }}/packages/maven/no.ssb.guardian.guardian-client/versions" \
               --paginate -q '.[].name' 2>/dev/null | grep -qx "$VERSION"; then
            echo "Version $VERSION is already in GitHub Packages, skipping deploy."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Packages
        if: steps.check.outputs.published == 'false'
        run: mvn --batch-mode -P github deploy -DskipTests

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
            exit 0
          fi
          VERSION=${{ steps.check.outputs.version }}
          mvn --batch-mode -q package -DskipTests
          shopt -s nullglob
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            ./target/guardian-client-"${VERSION}"*.jar
